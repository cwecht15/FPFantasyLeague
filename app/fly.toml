# fly.toml — FPFantasyLeague. Rename `app` before first `flyctl launch`/`deploy`.
# Two process groups share one image:
#   app    -> Next.js web (serves HTTP)
#   worker -> background job runner (draft clock, scoring rollups, waivers, email)
# Scale them independently:  flyctl scale count app=2 worker=1 --region iad

app = 'fpfl-fantasy'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'
  # Once the custom domain's cert is issued, set this to the bare hostname
  # (e.g. "fpfl.example.com") and redeploy: every other hostname, including
  # fpfl-fantasy.fly.dev, then 308-redirects to it. Keep AUTH_URL in sync.
  # [build.args]
  #   CANONICAL_HOST = "fpfl.example.com"

[processes]
  app = "node server.js"
  worker = "node dist/worker.js"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
