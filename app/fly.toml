# fly.toml — FPFantasyLeague. Rename `app` before first `flyctl launch`/`deploy`.
# Two process groups share one image:
#   app    -> Next.js web (serves HTTP)
#   worker -> background job runner (draft clock, scoring rollups, waivers, email)
# Scale them independently:  flyctl scale count app=2 worker=1 --region iad

app = 'fpfl-fantasy'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[processes]
  app = "node server.js"
  worker = "node dist/worker.js"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
